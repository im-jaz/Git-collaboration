<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jazmine & Virginia Bookstore</title>
     <link rel="stylesheet" href="style.css">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jazmine & Virginia Bookstore</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- HERO -->

    <section class="hero">

        <div class="hero-content">

            <h1>
                40% Discount On Books
                <br>
                By Susan Merrill
            </h1>

            <a href="#" class="btn">Shop Now</a>

        </div>

    </section>

    <!-- BOOKS -->

    <section class="books-section">

        <div class="section-title">

            <h2>Popular Book</h2>

        </div>


        <div class="book-grid">


            <!-- BOOK 1 -->

            <div class="book-card">

                <div class="book-image">

                    <img src="book1.jpg" alt="Cup Cake Dairies">

                </div>

                <h3>Cup Cake Dairies</h3>

                <p class="author">by Anna Hilton</p>

            </div>


            <!-- BOOK 2 -->

            <div class="book-card">

                <div class="book-image">

                    <img src="book2.jpg" alt="Broken Silence">

                </div>

                <h3>Broken Silence</h3>

                <p class="author">by Anna Hilton</p>

            </div>


            <!-- BOOK 3 -->

            <div class="book-card">

                <div class="book-image">

                    <img src="book3.jpg" alt="A Thousand Seed">

                </div>

                <h3>A Thousand Seed</h3>

                <p class="author">by Isabella Harper</p>

            </div>

        </div>

    </section>

</body>
</html>
    
</body>
